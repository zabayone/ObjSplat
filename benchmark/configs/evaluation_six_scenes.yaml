experiment_name: evaluation_six_scenes_complete
output_root: benchmark_results
python_executable: /opt/anaconda3/envs/layerpano3d/bin/python

input_preprocessing:
  # All sources are retained at their native resolution; working copies are
  # normalized so scene complexity, not input pixel count, drives comparison.
  target_width: 4096
  require_equirectangular_2_to_1: true

scenes:
  - name: indoor_1
    scene_root: benchmark_work/evaluation_main/indoor_1
    input_panorama: benchmark/evaluation/indoor_1.jpg
    pipeline_args: &indoor_args
      - --grounding_prompts
      - "wall . floor . ceiling . door . window . chair . table . sofa . bed . cabinet . shelf . lamp . plant . person"
      - --sky_segmentation_backend
      - grounding_sam
  - name: indoor_2
    scene_root: benchmark_work/evaluation_main/indoor_2
    input_panorama: benchmark/evaluation/indoor_2.jpg
    pipeline_args: *indoor_args
  - name: indoor_3
    scene_root: benchmark_work/evaluation_main/indoor_3
    input_panorama: benchmark/evaluation/indoor_3.jpg
    pipeline_args: *indoor_args
  - name: outdoor_1
    scene_root: benchmark_work/evaluation_main/outdoor_1
    input_panorama: benchmark/evaluation/outdoor_1.jpg
    pipeline_args: &outdoor_args
      - --grounding_prompts
      - "sky . road . pavement . grass . tree . trees . bush . shrub . plant . vegetation . foliage . branches . building . house . fence . pole . person . car"
      - --sky_segmentation_backend
      - hybrid
      - --require_sky_layer
      - --retexture_night_sky
      - --build_night_mood
  - name: outdoor_2
    scene_root: benchmark_work/evaluation_main/outdoor_2
    input_panorama: benchmark/evaluation/outdoor_2.jpg
    pipeline_args: *outdoor_args
  - name: outdoor_3
    scene_root: benchmark_work/evaluation_main/outdoor_3
    input_panorama: benchmark/evaluation/outdoor_3.jpg
    pipeline_args: *outdoor_args

rerun_segmentation: true
retrain: true
reuse_existing_outputs: true
# The focused ablations reuse these immutable scene inputs.
reuse_requires_scene_artifacts: true
run_monolithic_baseline: true
run_quality_evaluation: true
run_rendering_benchmark: true
run_edit_locality: true
run_mood_evaluation: true
fail_fast: false
random_seed: 42
resource_sampling_interval: 1.0

splits:
  training_fraction: 0.8
  evaluation_fraction: 0.2

rendering:
  width: 512
  height: 512
  warmup_frames: 5
  measured_frames: 30
  rasterizer: cpp

quality_evaluation:
  max_side: 512

monolithic:
  iterations: 1000
  image_size: 640
  rasterizer: cpp
  adaptive_topology: false

# Layer zero is evaluated consistently. Instance-level evaluation remains
# conditional on retained labels and can be added after inspecting metadata.
selected_layers: [0]
selected_instances: []

pipeline_args:
  - --device
  - mps
  - --depth_scale
  - "200"
  - --n_views
  - "12"
  - --phi_bands
  - "80,67.5,45,0,-45,-67.5,-80"
  - --perspective_size
  - "1024"
  - --use_grounding_dino
  - --grounding_box_threshold
  - "0.18"
  - --grounding_text_threshold
  - "0.15"
  - --grounding_mask_min_area
  - "500"
  - --grounding_infer_max_side
  - "1536"
  - --grounding_box_padding
  - "0.12"
  - --grounding_morph_open_kernel
  - "3"
  - --grounding_min_component_area_ratio
  - "0.01"
  - --aggregate_by_label
  - --min_frame_area
  - "1500"
  - --min_frames
  - "3"
  - --min_total_pixels
  - "10000"
  - --min_points_3d
  - "1000"
  - --quality
  - standard
  - --mps_rasterizer
  - cpp
  - --max_points
  - "0"
  - --downsample_ratio
  - "1.0"
  - --training_image_size
  - "640"
  - --layer_iterations
  - "800"
  - --background_iterations
  - "1000"
  - --sky_iterations
  - "500"
  - --global_refine_iters
  - "0"
